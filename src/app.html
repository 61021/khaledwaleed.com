<!doctype html>
<html lang="en" data-room="home">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a1220" />
		<meta name="color-scheme" content="dark" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="alternate" type="application/rss+xml" title="Khaled Waleed · Writing" href="/rss.xml" />

		<script>
			// Reloads land at the top of the room. Chromium restores the old
			// scroll using the PREVIOUS document's scrollRestoration (SvelteKit
			// flips it to auto on unload), so setting manual here cannot stop
			// it, and the restore can land either side of DOMContentLoaded.
			// Guard the load window instead: zero any restored offset the
			// moment it appears, stand down at load+400ms or on the visitor's
			// first gesture. The curtain overture covers the correction. Kit's
			// sessionStorage restore is dropped too; back/forward page loads
			// keep their native restore; reloads with a hash keep their anchor.
			if (performance.getEntriesByType('navigation')[0]?.type === 'reload' && !location.hash) {
				history.scrollRestoration = 'manual'
				try {
					sessionStorage.removeItem('sveltekit:scroll')
				} catch {}
				const gestures = ['wheel', 'touchstart', 'pointerdown', 'keydown']
				const toTop = () => {
					if (scrollY > 0) {
						document.documentElement.style.scrollBehavior = 'auto'
						scrollTo(0, 0)
						document.documentElement.style.removeProperty('scroll-behavior')
					}
				}
				const disarm = () => {
					removeEventListener('scroll', toTop, true)
					gestures.forEach((g) => removeEventListener(g, disarm, true))
				}
				addEventListener('scroll', toTop, { capture: true, passive: true })
				gestures.forEach((g) => addEventListener(g, disarm, { capture: true, passive: true }))
				addEventListener('DOMContentLoaded', toTop)
				addEventListener('load', () => setTimeout(disarm, 400))
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

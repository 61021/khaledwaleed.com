name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier + ESLint
        run: bun run lint

      - name: svelte-check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Build (adapter-cloudflare)
        run: bun run build

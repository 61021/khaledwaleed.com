name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version input: action-setup reads the packageManager pin
      # from package.json, so the version lives in one place.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: svelte-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build (adapter-cloudflare)
        run: pnpm build

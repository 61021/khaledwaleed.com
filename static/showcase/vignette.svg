<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
	<!-- The showcase drum's falloff, as an image so browsers raster it once: a key light from above, the walls falling away into the dark, the edges fading to the ground. -->
	<style>
		.ground { stop-color: #0a0a0a }
		.key { stop-color: #fff; stop-opacity: 0.1 }
		@media (prefers-color-scheme: light) {
			.ground { stop-color: #fafafa }
			.key { stop-color: #000; stop-opacity: 0.045 }
		}
	</style>
	<defs>
		<radialGradient id="key" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(50 24) scale(62 50)">
			<stop class="key" offset="0" />
			<stop class="ground" offset="0.74" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="walls" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(50 50) scale(104 92)">
			<stop class="ground" offset="0.52" stop-opacity="0" />
			<stop class="ground" offset="0.76" stop-opacity="0.5" />
			<stop class="ground" offset="1" stop-opacity="1" />
		</radialGradient>
		<linearGradient id="sides">
			<stop class="ground" offset="0" stop-opacity="0.82" />
			<stop class="ground" offset="0.09" stop-opacity="0" />
			<stop class="ground" offset="0.91" stop-opacity="0" />
			<stop class="ground" offset="1" stop-opacity="0.82" />
		</linearGradient>
		<linearGradient id="ends" x2="0" y2="1">
			<stop class="ground" offset="0" stop-opacity="0.82" />
			<stop class="ground" offset="0.15" stop-opacity="0" />
			<stop class="ground" offset="0.85" stop-opacity="0" />
			<stop class="ground" offset="1" stop-opacity="0.82" />
		</linearGradient>
	</defs>
	<rect width="100" height="100" fill="url(#key)" />
	<rect width="100" height="100" fill="url(#walls)" />
	<rect width="100" height="100" fill="url(#sides)" />
	<rect width="100" height="100" fill="url(#ends)" />
</svg>
